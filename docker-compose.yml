version: "3.8"
services:
  api:
    build: ./artifacts/api-server
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db
  frontend:
    build: ./artifacts/trustion
    ports:
      - "80:80"
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: trustion
      POSTGRES_PASSWORD: trustion
      POSTGRES_DB: trustion
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
